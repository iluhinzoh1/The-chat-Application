spring.application.name=chat-server
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/chatdb
spring.datasource.username=chat
spring.datasource.password=secret

# JPA / Hibernate (автоматическое создание таблиц)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis (обрати внимание, хост и порт отдельно!)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=chat-backend-group